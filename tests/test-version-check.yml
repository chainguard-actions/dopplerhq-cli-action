name: Test version check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
      - name: Assert doppler CLI runs and reports a version
        run: |
          echo "Running doppler --version..."
          VERSION_OUTPUT=$(doppler --version 2>&1)
          echo "Output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: doppler --version produced no output"
            exit 1
          fi
          echo "PASS: doppler --version output: $VERSION_OUTPUT"
      - name: Assert doppler binary is in workspace bin dir
        run: |
          EXPECTED_PATH="$GITHUB_WORKSPACE/bin/doppler"
          echo "Checking for binary at: $EXPECTED_PATH"
          if [ ! -f "$EXPECTED_PATH" ]; then
            echo "FAIL: doppler binary not found at $EXPECTED_PATH"
            exit 1
          fi
          echo "PASS: doppler binary found at $EXPECTED_PATH"
