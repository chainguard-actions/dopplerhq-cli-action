name: Test Doppler CLI functional check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: install
        uses: .
      - name: Assert doppler help command works
        run: |
          echo "Running doppler help..."
          OUTPUT=$(doppler help 2>&1)
          echo "doppler help output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: doppler help returned empty output"
            exit 1
          fi
          echo "PASS: doppler help returned output"
      - name: Assert doppler binary is executable
        run: |
          DOPPLER_PATH=$(command -v doppler)
          echo "doppler path: $DOPPLER_PATH"
          if [ ! -x "$DOPPLER_PATH" ]; then
            echo "FAIL: doppler binary at $DOPPLER_PATH is not executable"
            exit 1
          fi
          echo "PASS: doppler binary is executable"
